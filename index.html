<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meu Mural de Publicações</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Meu Mural de Publicações</h1>
    <p>Clique no botão para buscar publicações de exemplo na API JSONPlaceholder.</p>
  </header>

  <main>
    <div class="controles">
      <button id="btn-carregar" type="button">Carregar publicações</button>
      <input id="filtro" type="search" placeholder="Filtrar pelo título" aria-label="Filtrar pelo título" />
    </div>
    <p id="mensagem" role="status"></p>
    <section id="lista-posts" aria-label="Publicações"></section>
  </main>
</body>
</html>
